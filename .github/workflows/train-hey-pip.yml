name: Train free Hey Pip wakeword

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Heed installieren
        run: python -m pip install --upgrade pip "heed-wakeword[tts,export]"

      - name: Modellprojekt erstellen
        run: heed init hey_pip --phrase "hey pip"

      - name: TTS-Stimme herunterladen
        run: heed download-tts

      - name: Deutsche Piper-Stimme herunterladen
        run: |
          mkdir -p hey_pip/positive hey_pip/negative .voice
          curl --fail --location --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx" -o .voice/de_DE-thorsten-medium.onnx
          curl --fail --location --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx.json" -o .voice/de_DE-thorsten-medium.onnx.json
          test -s .voice/de_DE-thorsten-medium.onnx
          test -s .voice/de_DE-thorsten-medium.onnx.json

      - name: Deutsche positive und negative Sprachproben erzeugen
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            printf 'Hey Pip\n' | piper --model .voice/de_DE-thorsten-medium.onnx --output_file "hey_pip/positive/hey_pip_$i.wav"
          done
          i=0
          for phrase in "hallo du" "guten morgen" "wie geht es dir" "hey baby" "gute nacht" "pip" "hey bitte" "hey Peter" "hey Piep" "hi Pip" "hey Bib" "hallo Pip" "Hey, wie geht es dir" "guten Abend" "ich brauche Hilfe" "was machst du"; do
            i=$((i+1))
            printf '%s\n' "$phrase" | piper --model .voice/de_DE-thorsten-medium.onnx --output_file "hey_pip/negative/negative_$i.wav"
          done
          ls -lh hey_pip/positive hey_pip/negative

      - name: Hey-Pip-Modell trainieren
        run: heed train hey_pip --epochs 25 --tts-pos 250

      - name: Modell exportieren und prüfen
        run: |
          heed export hey_pip
          test -s hey_pip/export/wake.onnx
          test -s hey_pip/export/wake.int8.onnx
          test -s hey_pip/export/wake.json
          ls -lh hey_pip/export

      - name: Hey-Pip-Modell als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Hey-Pip-Wakeword-Model
          path: hey_pip/export/
          if-no-files-found: error
          retention-days: 90
