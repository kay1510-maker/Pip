name: Test Pip PC server

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax prüfen
        run: python -m py_compile pc-server/pip_server.py pc-server/test_pip_server.py
      - name: API, Authentifizierung, Gedächtnis und Fehlerpfade testen
        run: python -m unittest discover -s pc-server -p 'test_*.py' -v
