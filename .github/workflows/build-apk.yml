name: Build Pip APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK installieren
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir -p pip-src
          unzip -q Pip-v5-Qwen-TextOnly-CORRECTED.zip -d pip-src

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK prüfen
        run: |
          APK="pip-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
