name: Build Pip APK

on:
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir -p pip-src
          unzip -q Pip-v4.5-Qwen-1.5B-Supertonic.zip -d pip-src

      - name: Sherpa-ONNX laden
        run: |
          mkdir -p pip-src/app/libs
          wget -q --show-progress --tries=5 --timeout=60 \
            -O pip-src/app/libs/sherpa-onnx-1.13.7.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar"
          test -s pip-src/app/libs/sherpa-onnx-1.13.7.aar

      - name: Pip APK bauen
        run: gradle -p pip-src assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
