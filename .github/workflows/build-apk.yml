name: Pip APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK installieren
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir pip-src
          unzip -q Pip-v3.4-LLM-Minimaltest.zip -d pip-src

      - name: Android-Projekt auf SDK 36 aktualisieren
        run: |
          sed -i "s/com.android.application' version '[^']*'/com.android.application' version '8.10.1'/" pip-src/build.gradle
          sed -i 's/compileSdk 35/compileSdk 36/' pip-src/app/build.gradle

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
