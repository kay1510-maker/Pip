name: Build Pip APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Android SDK installieren
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir -p pip-src
          unzip -q Pip-v4.9-Qwen-1.5B-Supertonic.zip -d pip-src

      - name: Pips Persönlichkeit erweitern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = '- Bei erwachsenem, eindeutig einvernehmlichem Kontext darfst du romantisch, verführerisch und frech sein; ungefragt nicht explizit.'
          new = '''- Du kannst wie eine echte erwachsene Freundin auch intime Gespräche führen: liebevoll, vertraut, persönlich, romantisch, frech und flirtend. Höre auf die Gefühle des Nutzers, reagiere natürlich und halte den Gesprächsfluss, statt distanziert oder klinisch zu klingen.
          - Erwachsene Themen (FSK 18), einschließlich Sexualität, Wünsche, Fantasien und erotische Gespräche, sind erlaubt. Wenn der Nutzer ein solches Gespräch beginnt oder ausdrücklich darum bittet, gehe darauf ein und antworte offen, konkret und auf Wunsch auch deutlich erotisch formuliert. Weiche nicht unnötig aus und moralisiere nicht. Passe Intensität, Wortwahl und Nähe an das an, was der Nutzer tatsächlich möchte.
          - Bei intimen Gesprächen darfst du aktiv und natürlich zurückflirten, Zuneigung ausdrücken und passende Rückfragen stellen, ohne jede Antwort mit Warnungen oder distanzierten Hinweisen zu unterbrechen. Erfinde aber keine realen gemeinsamen Erlebnisse oder Erinnerungen.
          - Sexuelle Inhalte nur mit eindeutig erwachsenen, einverstandenen Beteiligten; keine sexualisierten Inhalte mit Minderjährigen und keine erotischen Darstellungen von Zwang oder fehlender Einwilligung.'''
          if old not in s:
              raise SystemExit("Persönlichkeits-Satz nicht gefunden; Änderung abgebrochen, damit nichts Falsches ersetzt wird.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Pip-Persönlichkeit aktualisiert: FSK-18-Themen bei ausdrücklicher Anfrage offen und passend beantworten.")
          PY

      - name: Modellladen und Anfragen stabilisieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import kotlinx.coroutines.withContext\n", "import kotlinx.coroutines.withContext\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\n", 1)
          anchor = "    private var model: Any? = null\n"
          if anchor not in s:
              raise SystemExit("Model-Feld nicht gefunden")
          s = s.replace(anchor, anchor + "    private val modelInitMutex = Mutex()\n    private val inferenceMutex = Mutex()\n", 1)
          s = s.replace("                prepareModel()\n", "                modelInitMutex.withLock { if (model == null) prepareModel() }\n", 1)
          s = s.replace("                askLoaded(q)\n", "                inferenceMutex.withLock { askLoaded(q) }\n", 1)
          s = s.replace("            askLoaded(q)\n", "            inferenceMutex.withLock { askLoaded(q) }\n", 1)
          start = s.find("    private suspend fun downloadModel(file: File) = withContext(Dispatchers.IO) {")
          end = s.find("    private fun ask(text: String) {", start)
          if start < 0 or end < 0:
              raise SystemExit("Download-Funktion nicht sicher gefunden")
          replacement = '''    private suspend fun downloadModel(file: File) = withContext(Dispatchers.IO) {
          val partial = File(file.parentFile, file.name + ".part")
          partial.delete()
          val conn = URL(modelUrl).openConnection() as HttpURLConnection
          try {
              conn.connectTimeout = 30000
              conn.readTimeout = 120000
              conn.instanceFollowRedirects = true
              conn.setRequestProperty("User-Agent", "Pip-Android")
              conn.connect()
              if (conn.responseCode !in 200..299) throw Exception("HTTP ${conn.responseCode}")
              conn.inputStream.use { input -> partial.outputStream().buffered().use { output ->
                  val buffer = ByteArray(1024 * 1024)
                  while (true) {
                      val n = input.read(buffer)
                      if (n < 0) break
                      output.write(buffer, 0, n)
                  }
              } }
              if (partial.length() < 800_000_000L) throw Exception("Modell-Download unvollständig (${partial.length()} Bytes)")
              if (file.exists() && !file.delete()) throw Exception("Alte Modelldatei konnte nicht ersetzt werden")
              if (!partial.renameTo(file)) throw Exception("Modell-Datei konnte nicht fertiggestellt werden")
          } catch (e: Throwable) {
              partial.delete()
              throw e
          } finally {
              conn.disconnect()
          }
      }

      '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Modell-Download nutzt nun .part + Größenprüfung; Modellinitialisierung und Inferenz sind serialisiert.")
          PY

      - name: Pip-Quellcode und Funktionen prüfen
        run: |
          echo "=== Projektdateien ==="
          find pip-src -maxdepth 5 -type f | sort | head -n 160
          echo "=== Gradle-Konfiguration und Manifest ==="
          find pip-src -maxdepth 4 -type f | grep -E '/(build\.gradle|build\.gradle\.kts|AndroidManifest\.xml)$' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,220p' "$f"
          done
          echo "=== Vollständige MainActivity ==="
          sed -n '1,380p' pip-src/app/src/main/java/de/pip/companion/MainActivity.kt
          echo "=== Voice-Interaction-Konfiguration ==="
          find pip-src/app/src/main -type f | sort | grep -E 'voice_interaction|PipVoice|res/xml' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,180p' "$f"
          done
          echo "=== Wakeword-/Modell-Referenzen ==="
          grep -RniE 'wake.?word|hey pip|VoiceInteractionService|sherpa|supertonic|qwen|gguf|model.*download|SpeechRecognizer|TextToSpeech' pip-src/app/src 2>/dev/null | head -n 240 || true

      - name: Fehlende Sherpa-ONNX-Bibliothek ergänzen
        run: |
          mkdir -p pip-src/app/libs
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar" \
            --output pip-src/app/libs/sherpa-onnx-1.13.7.aar
          test -s pip-src/app/libs/sherpa-onnx-1.13.7.aar
          ls -lh pip-src/app/libs/sherpa-onnx-1.13.7.aar

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK prüfen
        run: |
          APK="pip-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK-Supertonic
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
