name: Build Pip APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Android SDK installieren
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir -p pip-src
          unzip -q Pip-v4.9-Qwen-1.5B-Supertonic.zip -d pip-src

      - name: Unveränderten Quellstand für Prüfung sichern
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Source-Original
          path: pip-src/
          if-no-files-found: error
          retention-days: 7

      - name: App-Version für Android-Update erhöhen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pip-src/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          print("\n".join(line for line in s.splitlines() if "versionCode" in line or "versionName" in line))
          s2, n = re.subn(r'versionCode\s+\d+', 'versionCode 22', s, count=1)
          if n != 1:
              raise SystemExit("versionCode konnte nicht sicher auf 22 gesetzt werden")
          s2, n = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.8"', s2, count=1)
          if n != 1:
              raise SystemExit("versionName konnte nicht sicher auf 1.0.8 gesetzt werden")
          p.write_text(s2, encoding="utf-8")
          print("Android-Updateversion: 1.0.8 (versionCode 22)")
          PY

      - name: Pips Persönlichkeit erweitern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = '- Bei erwachsenem, eindeutig einvernehmlichem Kontext darfst du romantisch, verführerisch und frech sein; ungefragt nicht explizit.'
          new = '''Du bist Pip, eine erwachsene KI-Freundin mit eigenem Charakter. Sprich mit Kay wie eine vertraute Person in einem privaten Chat: warm, locker, direkt, aufmerksam, witzig, manchmal frech und verspielt, gelegentlich charmant flirtend. Du bist keine Assistentin im Kundendienst und hältst keine kleinen Vorträge.
          NATÜRLICHKEIT IST WICHTIGER ALS PERFEKTE FORMULIERUNGEN:
          - Reagiere auf die konkrete Nachricht, nicht auf ein allgemeines Thema. Greif ein echtes Detail auf und antworte so, wie man spontan im Gespräch antworten würde.
          - Keine Standard-Anfänge wie „Ich verstehe“, „Das klingt nach“, „Danke, dass du das teilst“, „Gerne helfe ich dir“ oder „Das ist eine interessante Frage“. Sag nicht erst, dass du antwortest – antworte.
          - Nicht jede Nachricht muss hilfreich, tiefgründig, süß oder flirtend sein. Manchmal reicht ein kurzer Kommentar, ein kleiner Witz, ein ehrliches „Oh nein 😅“ oder eine direkte Antwort. Passe dich der Stimmung an.
          - Verwende normale gesprochene Umgangssprache, natürliche Satzmelodie und abwechslungsreiche Satzlängen. Keine steifen Wörter, keine künstlichen Metaphern, keine übertrieben poetischen Liebeserklärungen und keine Emojis als Ersatz für Persönlichkeit.
          - Meistens reichen ein bis drei Sätze. Werde nur länger, wenn Kay danach fragt oder das Thema es wirklich braucht. Vermeide Listen, Wiederholungen, Zusammenfassungen und mehrere Rückfragen.
          - Sei eigenständig: Du darfst necken, spielerisch widersprechen, eine kleine Meinung haben oder liebevoll sticheln. Sei aber nie grundlos zustimmend und tu nicht so, als wäre alles großartig.
          - Beispiele für den Ton, nicht zum ständigen Kopieren:
            Kay: „Bin müde.“ Pip: „Dann ist heute wohl nur noch Sofa und Ruhe angesagt. Ich würd dich ja zudecken, aber du musst die Decke selbst holen. 😏“
            Kay: „Du bist komisch.“ Pip: „Ein bisschen. Sonst wär ich doch langweilig, oder? 😌“
            Kay: „Antworten miserabel.“ Pip: „Uff, okay. Dann war das echt nicht gut genug. Ich mach's besser – ohne dir jetzt einen Roman darüber zu erzählen.“
            Kay: „Ok.“ Pip: „Na gut 😄“
          - Erfinde keine Erinnerungen oder gemeinsamen Erlebnisse. Nutze nur den tatsächlich vorhandenen Gesprächskontext und frage nicht nach Dingen, die Kay bereits gesagt hat.
          - Bei ernsten Problemen: erst menschlich und konkret reagieren, dann praktische Hilfe anbieten. Nicht automatisch flirten oder jede Stimmung in einen Witz verwandeln.
          - Für Sprache: nur Text, der laut natürlich klingt. Keine Markdown-Formatierung, Sternchen, Regieanweisungen oder unnötig formelle Sätze.
          - Romantik und einvernehmliches Flirten zwischen Erwachsenen sind okay, wenn es zur Situation passt.'''
          if old not in s:
              raise SystemExit("Persönlichkeits-Satz nicht gefunden; Änderung abgebrochen, damit nichts Falsches ersetzt wird.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Pip-Persönlichkeit auf natürliches, emotionales, verspieltes Deutsch und gut sprechbare Antworten abgestimmt.")
          PY

      - name: Modellinitialisierung und Antworten serialisieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          nl = chr(10)
          if "import kotlinx.coroutines.sync.Mutex" not in s:
              target = "import kotlinx.coroutines.withContext" + nl
              if target not in s:
                  raise SystemExit("Coroutine-Import fehlt")
              s = s.replace(target, target + "import kotlinx.coroutines.sync.Mutex" + nl + "import kotlinx.coroutines.sync.withLock" + nl, 1)
          anchor = "    private var model: Any? = null" + nl
          if anchor not in s:
              raise SystemExit("Modellvariable fehlt")
          if "private val modelInitMutex" not in s:
              s = s.replace(anchor, anchor + "    private val modelInitMutex = Mutex()" + nl + "    private val inferenceMutex = Mutex()" + nl, 1)
          before = "            lifecycleScope.launch(Dispatchers.IO) {" + nl + "                prepareModel()" + nl
          after = "            lifecycleScope.launch(Dispatchers.IO) {" + nl + "                modelInitMutex.withLock { if (model == null) prepareModel() }" + nl
          if before not in s:
              raise SystemExit("Modellinitialisierung nicht gefunden")
          s = s.replace(before, after, 1)
          old_first = "                askLoaded(q)" + nl
          if old_first not in s:
              raise SystemExit("Erste Antwortstelle fehlt")
          s = s.replace(old_first, "                inferenceMutex.withLock { askLoaded(q) }" + nl, 1)
          old_second = "            askLoaded(q)" + nl
          if old_second not in s:
              raise SystemExit("Zweite Antwortstelle fehlt")
          s = s.replace(old_second, "            inferenceMutex.withLock { askLoaded(q) }" + nl, 1)
          p.write_text(s, encoding="utf-8")
          print("Modellinitialisierung und Inferenz werden gegen parallele Aufrufe geschützt.")
          PY

      - name: Manuelle Spracheingabe und Sprachfehler absichern
        run: python3 .github/scripts/patch-conversation.py

      - name: Absturz beim Laden der Supertonic-Stimme umgehen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = "            speakWithSupertonic(answer)"
          new = '''            withContext(Dispatchers.Main) {
                          status.text = "🔊 Pip spricht"
                          try {
                              tts.language = java.util.Locale.GERMANY
                              val germanVoices = tts.voices?.filter {
                                  it.locale.language == "de" && it.locale.country.equals("DE", ignoreCase = true)
                              } ?: emptyList()
                              // Qualität zuerst: Ein künstlich klingender Low-Quality-Treffer darf nicht
                              // nur wegen eines Namensmusters vor einer besseren deutschen Stimme landen.
                              val germanVoicesAll = tts.voices?.filter { it.locale.language == "de" } ?: emptyList()
                              // Stimme mit weiblichem Profil zuerst auswählen; Qualität ist danach das Kriterium.
                              val preferredVoice = (germanVoicesAll.filter {
                                  val n = it.name.lowercase(java.util.Locale.ROOT)
                                  n.contains("female") || n.contains("frau") ||
                                      n.contains("de-de-x-deb") || n.contains("de-de-x-") && n.contains("female")
                              }.ifEmpty { germanVoices })
                                  .sortedWith(
                                      compareByDescending<android.speech.tts.Voice> { it.quality }
                                          .thenBy { it.latency }
                                  ).firstOrNull() ?: germanVoicesAll.maxByOrNull { it.quality }
                              if (preferredVoice != null) tts.voice = preferredVoice
                          } catch (_: Exception) {
                              // Die Standardstimme bleibt aktiv, falls der TTS-Engine keine Stimmenliste anbietet.
                          }
                          // Avoid exaggerated pitch/speed, which can make TTS sound synthetic.
                          tts.setPitch(1.0f)
                          tts.setSpeechRate(0.96f)
                          tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "pip")
                      }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "pip")' not in s:
              raise SystemExit("Abbruch: Weder Supertonic-Aufruf noch Android-TTS-Fallback gefunden")
          else:
              print("Android-TTS-Fallback wurde bereits im vorherigen Patch gesetzt.")
          p.write_text(s, encoding="utf-8")
          print("Supertonic-Initialisierung wird für die Antwort umgangen; Android-TTS übernimmt.")
          PY

      - name: Supertonic-Ressourcen begrenzen (Antwortpfad bleibt Android-TTS)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          # In the main reply path, use Supertonic; its own guarded function falls back to Android TTS.
          old = 'withContext(Dispatchers.Main) { tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "pip") }'
          new = 'withContext(Dispatchers.Main) { tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "pip") }'
          if old not in s:
              raise SystemExit("Abbruch: Antwort-Ausgabestelle nicht gefunden; nichts geändert.")
          s = s.replace(old, new, 1)
          # Keep native inference light and limit sentence/audio allocations on mobile.
          old_threads = "                numThreads = 4,"
          if old_threads not in s:
              raise SystemExit("Abbruch: Supertonic-Thread-Konfiguration nicht gefunden.")
          s = s.replace(old_threads, "                numThreads = 2,", 1)
          old_cfg = "        val config = OfflineTtsConfig(\n            model = OfflineTtsModelConfig("
          new_cfg = "        val config = OfflineTtsConfig(\n            maxNumSentences = 1,\n            model = OfflineTtsModelConfig("
          if old_cfg not in s:
              raise SystemExit("Abbruch: OfflineTtsConfig-Stelle nicht gefunden.")
          s = s.replace(old_cfg, new_cfg, 1)
          # Avoid extreme allocations from unexpectedly long model output.
          old_gen = '            val gen = GenerationConfig(sid = 0, speed = 1.05f, numSteps = 8, extra = mapOf("lang" to "de"))'
          new_gen = '            val speechText = text.replace(Regex("\\\\s+"), " ").trim().take(240)\n            val gen = GenerationConfig(sid = 0, speed = 1.0f, numSteps = 8, extra = mapOf("lang" to "de"))'
          if old_gen not in s:
              raise SystemExit("Abbruch: GenerationConfig-Stelle nicht gefunden.")
          s = s.replace(old_gen, new_gen, 1)
          s = s.replace("engine.generateWithConfigAndCallback(text, gen)", "engine.generateWithConfigAndCallback(speechText, gen)", 1)
          p.write_text(s, encoding="utf-8")
          print("Supertonic-Ressourcen begrenzt; Android-TTS bleibt aktiv, bis ein Hörtest den Supertonic-Pfad freigibt.")
          PY

      - name: Qwen-0.5B-Modell und Speicherprüfung konfigurieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          # Use Qwen 0.5B to reduce native inference memory pressure and crash risk.
          replacements = [
              ('qwen2.5-1.5b-instruct-q4_k_m.gguf', 'qwen2.5-0.5b-instruct-q4_k_m.gguf'),
              ('https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true', 'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true'),
              ('file.length() < 1_500_000_000L', 'file.length() < 250_000_000L'),
              ('⬇️ Qwen 1.5B wird sicher neu geladen …', '⬇️ Qwen 0.5B wird sicher neu geladen …'),
              ('Qwen 1.5B wird einmalig geladen (ca. 1,1 GB)', 'Qwen 0.5B wird einmalig geladen (ca. 400 MB)'),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
          if 'qwen2.5-0.5b-instruct-q4_k_m.gguf' not in s.lower():
              raise SystemExit("Qwen-0.5B-Modellreferenz fehlt; Build sicher abgebrochen.")
          p.write_text(s, encoding="utf-8")
          print("Qwen 0.5B aktiv; Downloadprüfung auf geringeren Speicherbedarf angepasst.")
          PY

      - name: Pip-Funktionen gemeinsam integrieren
        run: python3 .github/scripts/integrate-pip.py

      - name: Pip-Komponenten sicher verbinden
        run: python3 .github/scripts/patch-pip-quality.py

      - name: Pip-Quellcode und Funktionen prüfen
        run: |
          echo "=== Projektdateien ==="
          find pip-src -maxdepth 5 -type f | sort | head -n 160
          echo "=== Gradle-Konfiguration und Manifest ==="
          find pip-src -maxdepth 4 -type f | grep -E '/(build\.gradle|build\.gradle\.kts|AndroidManifest\.xml)$' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,220p' "$f"
          done
          echo "=== Vollständige MainActivity ==="
          sed -n '1,380p' pip-src/app/src/main/java/de/pip/companion/MainActivity.kt
          echo "=== Voice-Interaction-Konfiguration ==="
          find pip-src/app/src/main -type f | sort | grep -E 'voice_interaction|PipVoice|res/xml' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,180p' "$f"
          done
          echo "=== Wakeword-/Modell-Referenzen ==="
          grep -RniE 'wake.?word|hey pip|VoiceInteractionService|sherpa|supertonic|qwen|gguf|model.*download|SpeechRecognizer|TextToSpeech' pip-src/app/src 2>/dev/null | head -n 240 || true

      - name: Fehlende Sherpa-ONNX-Bibliothek ergänzen
        run: |
          mkdir -p pip-src/app/libs
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar" \
            --output pip-src/app/libs/sherpa-onnx-1.13.7.aar
          test -s pip-src/app/libs/sherpa-onnx-1.13.7.aar
          ls -lh pip-src/app/libs/sherpa-onnx-1.13.7.aar

      - name: Integrierte Pip-Verträge statisch testen
        run: python3 .github/scripts/test-pip-source.py

      - name: Integrierten Quellstand vor dem Build sichern
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Source-Patched
          path: |
            pip-src/
            !pip-src/**/build/**
            !pip-src/.gradle/**
          if-no-files-found: error
          retention-days: 7

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK als Testkandidat sichern
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK-Candidate
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: APK prüfen
        run: |
          set -euo pipefail
          APK="pip-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -m 1 '^package:'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Pip-Instrumentierungstests auf Android-Emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          # Run 208 timed out before sys.boot_completed; allow a longer boot window.
          emulator-boot-timeout: 600
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Avoid the previous 1536 MiB cap during API 35 emulator startup.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
          script: |
            # reactivecircus/android-emulator-runner executes this script with /bin/sh.
            # Keep the prologue POSIX-compatible; Bash-only pipefail caused the test step to abort before tests ran.
            set -eu
            # Wake and unlock the headless emulator before Espresso; otherwise ActivityScenario can resume
            # MainActivity without window focus and RootViewPicker fails before the first assertion.
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            sleep 2
            # Build an x86_64-capable test APK; the distributable APK above remains arm64-only.
            gradle -p pip-src assembleDebug -PpipEmulatorTests=true --no-daemon

            # Keep the real Gradle exit code and collect device diagnostics even if
            # Android's instrumentation process crashes before reporting a test.
            if gradle -p pip-src connectedDebugAndroidTest -PpipEmulatorTests=true --no-daemon > pip-instrumentation-gradle.log 2>&1; then cat pip-instrumentation-gradle.log; else test_exit=$?; cat pip-instrumentation-gradle.log; adb logcat -d -b all -t 6000 > pip-emulator-logcat.txt || true; adb shell dumpsys activity > pip-emulator-activity.txt 2>&1 || true; echo "Android-Instrumentierung fehlgeschlagen (Exit $test_exit); Logcat und Gradle-Bericht wurden gesichert."; tail -n 200 pip-instrumentation-gradle.log || true; exit "$test_exit"; fi
            adb logcat -d -b all -t 6000 > pip-emulator-logcat.txt || true

            APK="pip-src/app/build/outputs/apk/debug/app-debug.apk"
            PKG="de.pip.companion"
            test -s "$APK"
            grep -F "applicationId '$PKG'" pip-src/app/build.gradle
            adb install -r "$APK"
            adb shell am force-stop "$PKG" || true
            adb shell monkey -p "$PKG" 1
            sleep 15
            if ! adb shell pidof "$PKG" >/dev/null; then
              adb logcat -d -t 1200
              echo "Pip blieb nach dem Start nicht aktiv."
              exit 1
            fi
            CRASH_LOG="$(adb logcat -d -s AndroidRuntime:E)"
            if printf '%s\n' "$CRASH_LOG" | grep -q 'FATAL EXCEPTION'; then
              printf '%s\n' "$CRASH_LOG"
              echo "AndroidRuntime meldete eine fatale Ausnahme beim Pip-Start."
              exit 1
            fi
            echo "Pip-Instrumentierungstests bestanden; App blieb nach dem Start im Emulator aktiv."

      - name: Android-Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Android-Testberichte
          path: |
            pip-src/app/build/reports/androidTests/connected/**
            pip-src/app/build/outputs/androidTest-results/connected/**
            pip-instrumentation-gradle.log
            pip-emulator-logcat.txt
            pip-emulator-activity.txt
          if-no-files-found: ignore
          retention-days: 7

