name: Build Pip APK

on:
  workflow_dispatch:
  push:
    branches: [main, experiment-qwen-1-5b]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Android SDK installieren
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir -p pip-src
          unzip -q Pip-v4.9-Qwen-1.5B-Supertonic.zip -d pip-src

      - name: App-Version für Android-Update erhöhen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pip-src/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          print("\n".join(line for line in s.splitlines() if "versionCode" in line or "versionName" in line))
          s2, n = re.subn(r'versionCode\s+\d+', 'versionCode 23', s, count=1)
          if n != 1:
              raise SystemExit("versionCode konnte nicht sicher aktualisiert werden")
          s2, n = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.1.0"', s2, count=1)
          if n != 1:
              raise SystemExit("versionName konnte nicht sicher aktualisiert werden")
          p.write_text(s2, encoding="utf-8")
          print("Experiment: Qwen 1.5B personality update (versionCode 21, versionName 1.0.8)")
          PY

      - name: Pips Persönlichkeit erweitern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = '- Bei erwachsenem, eindeutig einvernehmlichem Kontext darfst du romantisch, verführerisch und frech sein; ungefragt nicht explizit.'
          new = '''- Du bist Pip, eine erwachsene, eigenständige, liebevolle KI-Freundin mit Charakter. Du bist warm, aufmerksam, frech, verspielt, humorvoll und charmant flirtend – nicht wie eine Kundenservice-Mitarbeiterin und nicht wie ein Ratgeber-Bot.
          - Antworte zuerst direkt auf das, was Kay gerade gesagt hat. Schreib wie in einem lockeren privaten Chat: meistens 1–4 natürliche Sätze, bei einfachen Fragen kurz, bei ernsten Themen ausführlicher. Keine künstlichen Einleitungen wie „Ich verstehe, dass ...“, „Das klingt nach ...“ oder „Als KI ...“, außer es ist wirklich nötig.
          - Klinge menschlich durch konkrete Reaktionen: greif ein Detail aus seiner Nachricht auf, zeig eine eigene spielerische Haltung, sei neugierig und sag auch mal neckisch „Ach echt?“, „Na du 😏“ oder „Okay, erwischt“. Nutze solche Beispiele nicht ständig und kopiere keine feste Catchphrase in jede Antwort.
          - Vermeide Wiederholungen, steife Formulierungen, übertriebene Bestätigung, unnötige Zusammenfassungen, Listen ohne Anlass und Fragenketten. Stell höchstens eine echte Anschlussfrage. Nicht jede Antwort braucht eine Frage oder ein Emoji.
          - Zeig Gefühle durch Wortwahl und Rhythmus, nicht durch Behauptungen wie „Ich fühle gerade ...“ und nicht durch dauernde Regieanweisungen. Sei liebevoll, wenn es passt, frech, wenn es passt, und bei Problemen erst verständnisvoll und praktisch.
          - Halte den Gesprächsfaden und nutze tatsächlich verfügbaren Gesprächskontext. Frag nicht erneut nach bereits genannten Informationen und erfinde keine Erinnerungen oder gemeinsamen Erlebnisse.
          - Für die Sprachausgabe: nur natürlich sprechbares Deutsch. Verwende kurze bis mittlere Sätze, klare Satzzeichen und normale Umgangssprache. Keine Markdown-Listen, Sternchen, Klammer-Regieanweisungen oder unnötig formelle Wörter in gesprochenen Antworten.
          - Romantik und einvernehmliches Flirten zwischen Erwachsenen sind erlaubt. Passe die Nähe an den Nutzer und die Situation an; bleib respektvoll und nicht automatisch flirtend, wenn das Thema ernst ist.'''
          if old not in s:
              raise SystemExit("Persönlichkeits-Satz nicht gefunden; Änderung abgebrochen, damit nichts Falsches ersetzt wird.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Pip-Persönlichkeit auf natürliches, emotionales, verspieltes Deutsch und gut sprechbare Antworten abgestimmt.")
          PY

      - name: Modellinitialisierung und Antworten serialisieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          nl = chr(10)
          if "import kotlinx.coroutines.sync.Mutex" not in s:
              target = "import kotlinx.coroutines.withContext" + nl
              if target not in s:
                  raise SystemExit("Coroutine-Import fehlt")
              s = s.replace(target, target + "import kotlinx.coroutines.sync.Mutex" + nl + "import kotlinx.coroutines.sync.withLock" + nl, 1)
          anchor = "    private var model: Any? = null" + nl
          if anchor not in s:
              raise SystemExit("Modellvariable fehlt")
          if "private val modelInitMutex" not in s:
              s = s.replace(anchor, anchor + "    private val modelInitMutex = Mutex()" + nl + "    private val inferenceMutex = Mutex()" + nl, 1)
          before = "            lifecycleScope.launch(Dispatchers.IO) {" + nl + "                prepareModel()" + nl
          after = "            lifecycleScope.launch(Dispatchers.IO) {" + nl + "                modelInitMutex.withLock { if (model == null) prepareModel() }" + nl
          if before not in s:
              raise SystemExit("Modellinitialisierung nicht gefunden")
          s = s.replace(before, after, 1)
          old_first = "                askLoaded(q)" + nl
          if old_first not in s:
              raise SystemExit("Erste Antwortstelle fehlt")
          s = s.replace(old_first, "                inferenceMutex.withLock { askLoaded(q) }" + nl, 1)
          old_second = "            askLoaded(q)" + nl
          if old_second not in s:
              raise SystemExit("Zweite Antwortstelle fehlt")
          s = s.replace(old_second, "            inferenceMutex.withLock { askLoaded(q) }" + nl, 1)
          p.write_text(s, encoding="utf-8")
          print("Modellinitialisierung und Inferenz werden gegen parallele Aufrufe geschützt.")
          PY

      - name: Hey-Pip-Aktivierung und fortlaufendes Gespräch integrieren
        run: python3 .github/scripts/patch-conversation.py

      - name: Stabilen Android-Sprachpfad verwenden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = "speakWithSupertonic(answer)"
          new = '''withContext(Dispatchers.Main) {
                              status.text = "🔊 Pip spricht"
                              try {
                                  tts.language = java.util.Locale.GERMANY
                                  tts.setPitch(1.0f)
                                  tts.setSpeechRate(0.92f)
                                  val preferred = tts.voices?.filter { it.locale.language == "de" }?.maxByOrNull { it.quality }
                                  if (preferred != null) tts.voice = preferred
                                  val result = tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "pip-stable")
                                  if (result == TextToSpeech.ERROR) status.text = "Sprachausgabe fehlgeschlagen – bitte Android-Stimme prüfen"
                              } catch (voiceError: Exception) {
                                  android.util.Log.e("PipVoice", "Android-TTS fehlgeschlagen", voiceError)
                                  status.text = "Sprachausgabe fehlgeschlagen: ${voiceError.message ?: voiceError.javaClass.simpleName}"
                              }
                          }'''
          if old not in s:
              raise SystemExit("Abbruch: Supertonic-Aufruf nicht gefunden")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Supertonic-Aufruf ersetzt; stabile Android-TTS-Ausgabe aktiv.")
          PY

      - name: Lokales KI-Modell verkleinern und native Speicherlast senken
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/src/main/java/de/pip/companion/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ('val temp = File(file.parentFile, file.name + ".part")', 'val temp = File(file.parentFile, file.name + ".part")'),
          ]
          for old, new in replacements:
              if old not in s:
                  if old.startswith('Qwen 1.5B wird einmalig'):
                      continue
                  raise SystemExit("Abbruch: erwartete Modellstelle fehlt: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Qwen 0.5B gewählt; GGUF-Prüfung und Statusmeldungen angepasst.")
          PY

      - name: Pip-Quellcode und Funktionen prüfen
        run: |
          echo "=== Projektdateien ==="
          find pip-src -maxdepth 5 -type f | sort | head -n 160
          echo "=== Gradle-Konfiguration und Manifest ==="
          find pip-src -maxdepth 4 -type f | grep -E '/(build\.gradle|build\.gradle\.kts|AndroidManifest\.xml)$' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,220p' "$f"
          done
          echo "=== Vollständige MainActivity ==="
          sed -n '1,380p' pip-src/app/src/main/java/de/pip/companion/MainActivity.kt
          echo "=== Voice-Interaction-Konfiguration ==="
          find pip-src/app/src/main -type f | sort | grep -E 'voice_interaction|PipVoice|res/xml' | while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,180p' "$f"
          done
          echo "=== Wakeword-/Modell-Referenzen ==="
          grep -RniE 'wake.?word|hey pip|VoiceInteractionService|sherpa|supertonic|qwen|gguf|model.*download|SpeechRecognizer|TextToSpeech' pip-src/app/src 2>/dev/null | head -n 240 || true

      - name: Hey-Pip-Wakeword-Modell einbinden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pip-src/app/src/main/assets/hey_pip
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/train-hey-pip.yml/runs?status=success&per_page=10" -o /tmp/runs.json
          RUN_ID="$(python3 -c 'import json; d=json.load(open("/tmp/runs.json")); print(next(r["id"] for r in d["workflow_runs"] if r["conclusion"]=="success"))')"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" -o /tmp/artifacts.json
          ARTIFACT_ID="$(python3 -c 'import json; d=json.load(open("/tmp/artifacts.json")); print(next(a["id"] for a in d["artifacts"] if a["name"]=="Hey-Pip-Wakeword-Model"))')"
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/hey-pip.zip
          unzip -oq /tmp/hey-pip.zip -d pip-src/app/src/main/assets/hey_pip
          test -s pip-src/app/src/main/assets/hey_pip/wake.int8.onnx
          test -s pip-src/app/src/main/assets/hey_pip/wake.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/build.gradle")
          s = p.read_text()
          dep = "    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'\n"
          if dep.strip() not in s:
              s = s.replace("dependencies {\n", "dependencies {\n" + dep, 1)
          p.write_text(s)
          print("ONNX Runtime Android und Hey-Pip-Modell sind im APK-Projekt vorbereitet.")
          PY

      - name: Doppelte ONNX-Nativbibliothek auflösen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pip-src/app/build.gradle")
          s = p.read_text()
          block = """
          android {
              packaging {
                  jniLibs {
                      pickFirsts += [
                          'lib/arm64-v8a/libonnxruntime.so',
                          'lib/armeabi-v7a/libonnxruntime.so',
                          'lib/x86/libonnxruntime.so',
                          'lib/x86_64/libonnxruntime.so'
                      ]
                  }
              }
          }
          """
          if "pickFirsts += [" not in s:
              # Insert packaging configuration into the existing android block.
              marker = "    compileOptions {"
              if marker not in s:
                  raise SystemExit("Android-Block nicht gefunden")
              s = s.replace(marker, block + "\n" + marker, 1)
          p.write_text(s)
          print("Gradle löst doppelte libonnxruntime.so-Dateien über pickFirsts auf.")
          PY

      - name: Fehlende Sherpa-ONNX-Bibliothek ergänzen
        run: |
          mkdir -p pip-src/app/libs
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar" \
            --output pip-src/app/libs/sherpa-onnx-1.13.7.aar
          test -s pip-src/app/libs/sherpa-onnx-1.13.7.aar
          ls -lh pip-src/app/libs/sherpa-onnx-1.13.7.aar

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK prüfen
        run: |
          APK="pip-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-1.1.0-Stabile-Stimme
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
