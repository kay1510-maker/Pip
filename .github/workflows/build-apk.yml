name: Pip APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK installieren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pip-Projekt aus ZIP entpacken
        run: |
          mkdir pip-src
          unzip -q Pip-v3-Gemma-Sprachbasis-Projekt.zip -d pip-src

      - name: Pip APK bauen
        run: |
          gradle -p pip-src assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Pip-APK
          path: pip-src/app/build/outputs/apk/debug/app-debug.apk
