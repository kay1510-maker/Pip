name: Validate Pip integration scripts (no APK build)

on:
  push:
    branches:
      - pip-spec-2026-10-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrationsskripte auf Syntax prüfen
        run: |
          python -m py_compile \
            .github/scripts/integrate-pip.py \
            .github/scripts/patch-conversation.py \
            .github/scripts/patch-pip-quality.py \
            .github/scripts/test-pip-source.py
      - name: UI-Testgenerator und manuelle APK-Ausführung absichern
        run: |
          python - <<'PY'
          from pathlib import Path

          patch = Path(".github/scripts/patch-pip-quality.py").read_text(encoding="utf-8")
          tests = Path(".github/scripts/test-pip-source.py").read_text(encoding="utf-8")
          build = Path(".github/workflows/build-apk.yml").read_text(encoding="utf-8")
          header = build.split("jobs:", 1)[0]

          uses_in_process_settings_test = "getLastSettingsDialogForTest" in patch
          checks = {
              "settings test generator uses the current focus-safe strategy": (
                  (
                      "ActivityScenario.onActivity" in patch
                      and "performClick()" in patch
                      and "UiDevice" not in patch
                  )
                  if uses_in_process_settings_test
                  else ("device.dumpWindowHierarchy(" in patch and "uiautomator dump" not in patch)
              ),
              "static source contracts cover the settings test": (
                  "getLastSettingsDialogForTest" in tests
                  or "missing UI controls capture accessibility hierarchy" in tests
              ),
              "APK build is branch-scoped and manually dispatchable": (
                  "workflow_dispatch:" in header
                  and "pull_request:" not in header
                  and "push:" in header
                  and "pip-spec-2026-10-25" in header
                  and "paths:" in header
                  and "Pip-v4.9-Qwen-1.5B-Supertonic.zip" in header
              ),
          }
          for label, passed in checks.items():
              print(f'{"PASS" if passed else "FAIL"}: {label}')
          failed = [label for label, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Integration script checks failed: " + ", ".join(failed))
          print(f"Passed {len(checks)} integration-script checks. No APK or device test was run by this workflow.")
          PY
